<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Lista de Tarefas</h1>
        <h2 id="titulo">Selecione um dia</h2>
    </header>

    <main>
        <section id="lista">

        </section>
        <aside>
            <button onclick="inserirTarefa()">Inserir Tarefa</button>
            <button onclick="dia(1)">Segunda-feira</button>
            <button onclick="dia(2)">Terça-feira</button>
            <button onclick="dia(3)">Quarta-feira</button>
            <button onclick="dia(4)">Quinta-feira</button>
            <button onclick="dia(5)">Sexta-feira</button>
        </aside>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
