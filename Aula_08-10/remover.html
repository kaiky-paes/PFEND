<!DOCTYPE html>
<html>
<script>
    function minhaFuncao() {
        const elemento = document.getElementById("demo");
        elemento.remove();
    }
</script>

<body>
    <h1>Objetos Elementos</h1>
    <h2>Elemento remove()</h2>
    <p id="demo">Clique para "Remove",no DOM.</p>
    <button onclick="minhaFuncao()">Remover</button>
</body>

</html>
