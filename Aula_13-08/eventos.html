<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Mouse</title>
</head>

<style>
    #container {
        margin: auto;
        width: 50%;
        height: 350px;
        width: 800px;
        border: solid;
        background-color: #960018;
    }

    h1 {
        text-align: center;
    }

    #principal {
        margin: auto;
        height: 150px;
        width: 150px;
        border: solid;
        border-color: #FFFFFF;
        border-radius: 75px;
        text-align: center;
        background-color: dimgrey;
    }

    #principal2 {
        margin: auto;
        height: 150px;
        width: 150px;
        border: solid;
        border-color: #FFFFFF;
        border-radius: 75px;
        text-align: center;
        background-color: dimgrey;
    }
</style>

<script>
    function acao1() {
        alert('Evento de Onclick')
        document.getElementById("principal").innerText = "CÍRCULO"
    }

    function acao2() {
        alert('Evento de Double Click')
        document.getElementById("principal2").innerText = "CÍRCULO2"
    }
</script>

<body>
    <h1>Eventos</h1>
    <div id="container">
        <div id="principal" onclick="acao1()"></div>
        <br>
        <div id="principal2" ondblclick="acao2()"></div>
    </div>
</body>

</html>
