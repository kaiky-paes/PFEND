<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Mouse</title>
</head>

<style>
    #container {
        margin: auto;
        width: 50%;
        height: 550px;
        width: 320px;
        border: solid;
        background-color: #000000;
    }

    h1 {
        text-align: center;
    }

    #principal {
        margin: auto;
        margin-top: 22px;
        height: 150px;
        width: 150px;
        border: solid;
        border-color: #FFFFFF;
        border-radius: 75px;
        text-align: center;
        background-color: dimgrey;
    }

    #principal2 {
        margin: auto;
        height: 150px;
        width: 150px;
        border: solid;
        border-color: #FFFFFF;
        border-radius: 75px;
        text-align: center;
        background-color: dimgrey;
    }

    #principal3 {
        margin: auto;
        height: 150px;
        width: 150px;
        border: solid;
        border-color: #FFFFFF;
        border-radius: 75px;
        text-align: center;
        background-color: dimgrey;
    }
</style>

<script>
    function acao(idAcao) {
        document.getElementById("principal").style.backgroundColor = "#696969"
        document.getElementById("principal2").style.backgroundColor = "#696969"
        document.getElementById("principal3").style.backgroundColor = "#696969"
        switch (idAcao) {
            case 1:
                document.getElementById("principal").style.backgroundColor = "#FF0000"
                break
            case 2:
                document.getElementById("principal2").style.backgroundColor = "#FFFF00"
                break
            case 3:
                document.getElementById("principal3").style.backgroundColor = "#00FF00"
                break
        }
    }
</script>

<body>
    <h1>Eventos</h1>
    <div id="container">
        <div id="principal" onclick="acao(1)"></div>
        <br>
        <div id="principal2" onclick="acao(2)"></div>
        <br>
        <div id="principal3" onclick="acao(3)"></div>
    </div>
</body>

</html>
