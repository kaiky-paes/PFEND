        var peso = prompt('Digite o seu peso:')
        var altura = prompt('Digite sua altura:')

        var imc = peso / (altura * altura)

        if (imc < 18.5) {
            document.write(`Seu IMC é: ${imc.toFixed(2)}, você está abaixo do peso.`)
        } else if (imc >= 18.5 && imc <= 24.9) {
            document.write(`Seu IMC é: ${imc.toFixed(2)}, você está com peso ideal.`)
        } else if (imc >= 25 && imc <= 29.9) {
            document.write(`Seu IMC é: ${imc.toFixed(2)}, você está levemente acima do peso.`)
        } else if (imc >= 30 && imc <= 34.9) {
            document.write(`Seu IMC é: ${imc.toFixed(2)}, você está com obesidade grau I.`)
        } else if (imc >= 35 && imc <= 39.9) {
            document.write(`Seu IMC é: ${imc.toFixed(2)}, você está com obesidade grau II.`)
        } else {
            document.write(`Seu IMC é: ${imc.toFixed(2)}, você está com obesidade grau III.`)
